<!-- Marked.js for turning Markdown into HTML -->

<style>
:root {
  --bg-primary: #ffffff; 
  --bg-secondary: #f9f9f9; 
  --text-main: #1a202c; 
  --text-muted: #4a5568; 
  --gold: #d4af37; 
  --gold-hover: #b5952f;
  --font-display: 'Cormorant Garamond', serif;
  --font-body: 'Jost', sans-serif;
  --font-arabic: 'Amiri', serif;
  --transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-body); background-color: var(--bg-primary); color: var(--text-main); line-height: 1.6; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; height: auto; display: block; }
a { text-decoration: none; color: inherit; }
.container { width: 90%; max-width: 1200px; margin: 0 auto; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; color: var(--text-main); }

.nav { position: fixed; top: 0; left: 0; width: 100%; padding: 1.5rem 0; z-index: 100; transition: var(--transition); background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); }
.nav.scrolled { padding: 1rem 0; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
.nav-inner { width: 90%; max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
.brand { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
.brand-mark { font-family: var(--font-arabic); color: var(--gold); font-size: 2rem; line-height: 1; }
.nav-links { display: none; }
@media (min-width: 900px) {
  .nav-links { display: flex; gap: 2.5rem; }
  .nav-links a { font-size: 0.95rem; font-weight: 500; color: var(--text-muted); transition: var(--transition); }
  .nav-links a:hover { color: var(--text-main); }
}
.nav-cta { font-size: 0.9rem; font-weight: 500; color: var(--gold); border: 1px solid var(--gold); padding: 0.5rem 1.25rem; border-radius: 4px; transition: var(--transition); }

.article-header { padding: 10rem 5% 4rem; text-align: center; max-width: 900px; margin: 0 auto; }
.article-meta { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); font-weight: 500; margin-bottom: 1.5rem; display: flex; justify-content: center; align-items: center; gap: 1rem; }
.article-meta span.dot { width: 4px; height: 4px; background-color: var(--gold); border-radius: 50%; }
.article-title { font-size: clamp(2.5rem, 4vw, 4rem); margin-bottom: 2rem; }

/* The container that holds the parsed Markdown */
.article-body { max-width: 720px; margin: 0 auto 8rem; font-size: 1.15rem; line-height: 1.8; color: var(--text-muted); }

.article-body img { 
  width: auto; 
  max-width: 60%; /* Reduced by another 20% */
  max-height: 150px; /* Reduced by another 20% */
  object-fit: cover; 
  object-position: center;
  border-radius: 6px; 
  margin: 2.5rem auto; /* Automatically centers the image */
  box-shadow: 0 15px 35px rgba(0,0,0,0.08); 
  display: block;
}

.article-body p { margin-bottom: 1.5rem; }
.article-body h1, .article-body h2 { font-size: 2.2rem; margin: 3rem 0 1rem; color: var(--text-main); }
.article-body h3 { font-size: 1.5rem; margin: 2rem 0 1rem; color: var(--text-main); }
.article-body blockquote { font-family: var(--font-display); font-size: 1.8rem; font-style: italic; color: var(--text-main); border-left: 2px solid var(--gold); padding-left: 2rem; margin: 3rem 0; line-height: 1.4; }
.article-body ul, .article-body ol { margin: 1.5rem 0 1.5rem 2rem; }
.article-body li { margin-bottom: 0.5rem; }
.article-body a { color: var(--gold); text-decoration: underline; }

.back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-main); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.85rem; margin-bottom: 4rem; transition: var(--transition); }
.back-link:hover { color: var(--gold); }
.loading { text-align: center; font-size: 1.2rem; margin: 4rem 0; color: var(--text-muted); }

/* Floating WhatsApp Button */
.wa-float {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background-color: #25D366;
  color: white;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 20px rgba(0,0,0,0.15);
  z-index: 100;
  transition: transform 0.3s ease;
}

.wa-float:hover {

}

.wa-float svg {
  width: 30px;

}

footer { background-color: var(--text-main); color: white; padding: 6rem 0 2rem; text-align: center; }
.footer-inner { display: flex; flex-direction: column; align-items: center; gap: 2rem; margin-bottom: 4rem; }
.footer-arabic { font-family: var(--font-arabic); font-size: 2.5rem; color: var(--gold); }
.footer-copy { color: rgba(255,255,255,0.4); font-size: 0.85rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 2rem; width: 90%; max-width: 1200px; margin: 0 auto; }
</style>
</head>

<script>
    const nav = document.getElementById('mainNav');
    window.addEventListener('scroll', () => {
        if (window.scrollY > 50) nav.classList.add('scrolled');
        else nav.classList.remove('scrolled');
    });

    // 
    const GITHUB_USERNAME = 'Rashi-Psy-ksd'; 
    const GITHUB_REPO = 'Happymadrassa'; 
    // ---------------------------------------------

    // Get the issue ID from the URL (e.g., post.html?id=3)
    const urlParams = new URLSearchParams(window.location.search);
    const issueId = urlParams.get('id');

    const headerBlock = document.getElementById('dynamic-header');
    const contentBlock = document.getElementById('dynamic-content');

    async function loadPost() {
        if (!issueId) {
            headerBlock.innerHTML = '<h1 class="article-title">Post Not Found</h1>';
            return;
        }

        try {
           

            const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/issues/${issueId}`);
            if (!response.ok) throw new Error('Post could not be loaded.');
            
            const issue = await response.json();
            
            // Format Date
            const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = new Date(issue.created_at).toLocaleDateString('en-US', dateOptions);
            
            // --- NEW AUTHOR EXTRACTION LOGIC ---
            let author = "Happy Madrassa Team"; // Default fallback
            let rawBody = issue.body || ""; // Get the raw markdown text
            
            // Look for "Author: Name" at the very beginning of the post
            const authorMatch = rawBody.match(/^Author:\s*(.+)/i);
            
            if (authorMatch) {
                author = authorMatch[1].trim(); // Extract the typed name
                // Remove that "Author" line and any immediate blank lines below it from the post body
                rawBody = rawBody.replace(/^Author:\s*(.+)(\r?\n)+/i, ''); 
            } else if (issue.user.login === 'Rashi-Psy-ksd') {
                author = 'Muhammad Rashid'; // Fallback if you forget to add the tag
            } else {
                author = issue.user.login;
            }
            // ------------------------------------

            // Inject Header
            headerBlock.innerHTML = `
                <div class="article-meta">
                    <span>${dateStr}</span>
                    <span class="dot"></span>
                    <span>By ${author}</span>
                </div>
                <h1 class="article-title">${issue.title}</h1>
            `;
            
            // Set Page Title
            document.title = `${issue.title} | Happy Madrassa`;

            // Parse Markdown to HTML
            // Note: Marked.js was loaded in the <head> of this file
            contentBlock.innerHTML = marked.parse(rawBody);

        } catch (error) {
            console.warn(error.message);
            
            // Demo Fallback Content
            if (issueId === 'demo1' || GITHUB_USERNAME === 'YOUR_GITHUB_USERNAME') {
                headerBlock.innerHTML = `
                    <div class="article-meta">
                        <span>August 5, 2026</span>
                        <span class="dot"></span>
                        <span>By Millath Directorate</span>
                    </div>
                    <h1 class="article-title">The Importance of Consistent Tajweed Practice</h1>
                `;
                document.title = `The Importance of Consistent Tajweed Practice | Happy Madrassa`;
                contentBlock.innerHTML = `
                    <p>For families living in diaspora communities, establishing a strong connection to the Qur'an can be a challenge. Without the daily rhythms of the local madrassa that many parents experienced growing up in Kerala, religious education is often relegated to Saturday mornings.</p>
                    <p>However, when it comes to the science of Tajweed (the precise articulation and rules of Qur'anic recitation), weekend-only study is rarely enough to build lasting muscle memory.</p>
                    
                    <img src="https://images.unsplash.com/photo-1609599006353-e629aaab315d?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt="Quranic pages">
                    
                    <h2>The Science of Muscle Memory</h2>
                    <p>Tajweed is not merely an intellectual pursuit; it is deeply physical. It requires training the tongue, the throat, and the vocal cords to produce sounds that do not naturally exist in English. For a child growing up in London or Toronto, the Arabic 'Ayn (ع) or Qaf (ق) requires daily conditioning.</p>
                    <blockquote>"Tajweed is like an athletic discipline of the tongue. It requires brief, daily conditioning rather than exhausted weekend marathons."</blockquote>
                    
                    <ul>
                        <li>Immediate correction of mispronunciations before they become bad habits.</li>
                        <li>Consistent engagement with the Arabic text, reinforcing visual recognition.</li>
                        <li>A daily anchor of faith in a child's secular routine.</li>
                    </ul>
                `;
            } else if (issueId === 'demo2') {
                 headerBlock.innerHTML = `
                    <div class="article-meta">
                        <span>July 22, 2026</span>
                        <span class="dot"></span>
                        <span>By Millath Directorate</span>
                    </div>
                    <h1 class="article-title">Maintaining Malayalam While Learning Arabic</h1>
                `;
                contentBlock.innerHTML = `<p>One of the most common concerns we hear from parents in the UK and Australia is how to balance their child's linguistic development...</p>`;
            } else {
                 headerBlock.innerHTML = `<h1 class="article-title">Error loading post</h1><p style="color:red;">${error.message}</p>`;
            }
        }
    }

    loadPost();
</script>
